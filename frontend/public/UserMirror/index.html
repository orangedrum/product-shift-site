<!DOCTYPE html>
<html>
  <head>
    <title>Product Shift AI</title>
    <style>
      /* Neo-Brutalist Reset */
      body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f3f4f6; }
      * { box-sizing: border-box; }
      
      /* Card Style */
      .card {
        background: white;
        border: 2px solid black;
        border-radius: 12px;
        padding: 16px;
        box-shadow: 4px 4px 0px 0px #000;
        margin-bottom: 16px;
      }

      h1 {
        font-size: 18px;
        font-weight: 900;
        margin: 0 0 8px 0;
        color: black;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      p {
        font-size: 13px;
        color: #4b5563;
        margin: 0 0 16px 0;
        line-height: 1.4;
      }

      /* Button Style */
      .btn {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        background: black;
        color: white;
        border: none;
        padding: 12px;
        font-weight: bold;
        font-size: 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.1s;
      }

      .btn:hover {
        background: #333;
        transform: translateY(-1px);
      }

      .btn:active {
        transform: translateY(1px);
      }

      .btn:disabled {
        background: #9ca3af;
        cursor: not-allowed;
        transform: none;
      }

      .btn-outline {
        background: white;
        color: black;
        border: 2px solid black;
      }

      .btn-outline:hover {
        background: #f3f4f6;
      }

      /* Screenshot Preview */
      .preview-container {
        margin-top: 16px;
        border: 2px solid black;
        border-radius: 8px;
        overflow: hidden;
        display: none;
        position: relative;
      }

      .preview-img {
        width: 100%;
        display: block;
      }

      .preview-badge {
        position: absolute;
        top: 8px;
        right: 8px;
        background: #ff1493;
        color: white;
        font-size: 10px;
        font-weight: bold;
        padding: 2px 6px;
        border-radius: 4px;
        border: 1px solid black;
      }

      /* Status/Results */
      .status {
        margin-top: 12px;
        font-size: 13px;
        font-weight: 600;
        text-align: center;
        min-height: 20px;
      }
      
      .error { color: #ef4444; }
      .success { color: #10b981; }

      /* Results Styling */
      .results-container {
        margin-top: 16px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .result-card {
        padding: 12px;
      }
      .persona-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      .avatar {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        border: 2px solid black;
        background-color: #e5e7eb;
      }
      .persona-name {
        font-weight: 900;
        font-size: 16px;
        color: black;
      }
      .persona-desc {
        font-size: 12px;
        color: #6b7280;
      }
      .mood-bubble {
        background-color: #f3f4f6;
        border-left: 4px solid #d1d5db;
        padding: 10px;
        font-style: italic;
        color: #4b5563;
        margin-bottom: 12px;
        border-radius: 0 4px 4px 0;
      }
      .mood-positive { border-color: #10b981; }
      .mood-negative { border-color: #ef4444; }
      .details {
        font-size: 13px;
        line-height: 1.5;
        color: #374151;
      }
      .details h4 {
        font-size: 14px;
        font-weight: bold;
        margin: 12px 0 4px 0;
      }
      
      /* Input Style */
      .input-field {
        width: 100%;
        padding: 10px;
        border: 2px solid black;
        border-radius: 8px;
        margin-bottom: 10px;
      }

      /* Score Chart */
      .score-container {
        margin-bottom: 16px;
      }
      .score-row {
        display: flex;
        align-items: center;
        margin-bottom: 8px;
      }
      .score-label {
        width: 80px;
        font-size: 12px;
        font-weight: bold;
      }
      .score-bar-bg {
        flex-grow: 1;
        height: 12px;
        background: #e5e7eb;
        border: 2px solid black;
        margin: 0 8px;
      }
      .score-bar-fill {
        height: 100%;
        background: black;
        width: 0%; /* Animated via JS */
        transition: width 1s ease-out;
      }
      .score-value {
        width: 30px;
        text-align: right;
        font-size: 12px;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>
        Product Shift
      </h1>
      <p>Analyze the current page for UX friction points using AI.</p>

      <!-- Login View (Default) -->
      <div id="login-view" style="text-align: center; padding: 20px 0;">
        <p>Enter your email to sign in.</p>
        
        <input type="email" id="emailInput" class="input-field" placeholder="name@company.com" />
        
        <button id="sendMagicLinkBtn" class="btn">
          Send Login Link
        </button>
        
        <button id="checkAuthBtn" class="btn-outline" style="margin-top: 10px; width: 100%; padding: 8px; border-radius: 8px; cursor: pointer;">
          I've Logged In (Check Again)
        </button>
        
        <div style="margin-top: 20px; font-size: 12px; color: #6b7280;">
          Don't have an account? <a href="https://www.theproductshift.com/agency-user-testing" target="_blank" style="color: black; font-weight: bold;">Create one here</a>
        </div>
      </div>

      <!-- App View (Hidden until Auth) -->
      <div id="app-view" style="display: none;">
        <button id="analyzeBtn" class="btn">
          Analyze Page
        </button>

        <div id="preview" class="preview-container">
          <div class="preview-badge">CAPTURED</div>
          <img id="screenshot" class="preview-img" />
        </div>

        <div id="status" class="status"></div>

        <div id="results-container"></div>
        
        <div style="margin-top: 20px; text-align: center; border-top: 1px solid #e5e7eb; padding-top: 10px;">
          <button id="testConnBtn" style="background:none; border:none; color:#6b7280; font-size:11px; text-decoration:underline; cursor:pointer; display: none;">Test Server Connection</button>
        </div>
      </div>
    </div>

    <script src="sidepanel.js"></script>
  </body>
</html>
